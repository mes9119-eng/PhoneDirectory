name: Build APK
on:
  push:
    paths-ignore: [directory.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk PhoneDirectory.apk
      - uses: actions/upload-artifact@v4
        with: { name: PhoneDirectory-apk, path: PhoneDirectory.apk }
      - name: Publish permanent download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: دليل التحويلات
          make_latest: true
          body: "تطبيق دليل التحويلات — تصميم وتطوير: مسفر القحطاني"
          files: PhoneDirectory.apk
