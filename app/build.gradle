plugins { id 'com.android.application' }
android {
    namespace 'sa.afhsr.extensions'
    compileSdk 34
    defaultConfig {
        applicationId "sa.afhsr.extensions"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    signingConfigs {
        fixed {
            storeFile file('signing.jks')
            storePassword 'phonedir'
            keyAlias 'phonedir'
            keyPassword 'phonedir'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed } release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
